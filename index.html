<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KauanPJL - Catálogo PS3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1e1e1e;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }

    /* BANNER SUPERIOR COM O TEU NOME */
    .header-banner {
      width: 100%;
      max-width: 800px;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #0f0f1a, #1b2838);
      border-bottom: 3px solid #00d26a;
      text-align: center;
      padding: 25px 10px;
    }

    .header-banner h1 {
      color: #00d26a;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 210, 106, 0.5);
    }

    .header-banner p {
      color: #aaa;
      font-size: 14px;
      margin-top: 5px;
    }

    /* CONTAINER DAS CATEGORIAS */
    .menu-container {
      width: 100%;
      max-width: 450px;
      padding: 0 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    /* BOTÃO DAS CATEGORIAS COM FOTO */
    .cat-btn {
      position: relative;
      display: block;
      width: 100%;
      height: 180px;
      background-color: #2a2a2a;
      border: 3px solid #444;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      transition: transform 0.2s, border-color 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    .cat-btn:hover {
      transform: scale(1.02);
      border-color: #00d26a;
    }

    .cat-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* TEXTO SOBRE A IMAGEM */
    .cat-title {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      padding: 10px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- BANNER TOPO KAUANPJL -->
  <div class="header-banner">
    <h1>KAUANPJL PS3</h1>
    <p>Portal Oficial de Downloads PS3</p>
  </div>

  <!-- MENU DE CATEGORIAS -->
  <div class="menu-container">

    <!-- LOJAS -->
    <a href="lojas.html" class="cat-btn">
      <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80" alt="Lojas">
      <div class="cat-title">LOJAS</div>
    </a>

    <!-- JOGOS (IMAGEM DO ZELDA) -->
    <a href="jogos.html" class="cat-btn">
      <img src="https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=800&q=80" alt="Jogos Zelda">
      <div class="cat-title">JOGOS</div>
    </a>

    <!-- HOMEBREWS -->
    <a href="ferramentas.html" class="cat-btn">
      <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80" alt="Homebrews">
      <div class="cat-title">HOMEBREWS</div>
    </a>

    <!-- TEMAS -->
    <a href="temas.html" class="cat-btn">
      <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80" alt="Temas">
      <div class="cat-title">TEMAS</div>
    </a>

  </div>

</body>
</html>
