<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Catálogo PS3</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #00d26a;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      max-width: 350px;
      margin: 20px auto;
      padding: 15px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .btn-mobile {
      background-color: #00d26a;
      color: #000;
    }
    .btn-ps3 {
      background-color: #2b384e;
      color: #58a6ff;
    }
  </style>
</head>
<body>

  <h1>🎮 MEU CATÁLOGO PS3</h1>
  <p>Downloads seguros para Celular, PC e PS3</p>

  <!-- CARD DE EXEMPLO -->
  <div class="card">
    <h3>Grand Theft Auto V</h3>
    <p>Formato: PKG | 17.2 GB</p>
    
    <!-- Botão Celular/PC (Gera dinheiro no ShrinkMe) -->
    <a href="SEU_LINK_DO_SHRINKME_AQUI" class="btn btn-mobile" target="_blank">📱 Baixar (Celular/PC)</a>
    
    <!-- Botão PS3 (Link direto sem travar) -->
    <a href="SEU_LINK_DIRETO_MEDIAFIRE_AQUI" class="btn btn-ps3" target="_blank">🎮 Baixar Direto (PS3)</a>
  </div>

</body>
</html>
