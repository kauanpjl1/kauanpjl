<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kauan PJL - Catálogo de Jogos PS3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: #0070d1;
            font-size: 24px;
            margin-bottom: 5px;
        }
        header p {
            color: #888;
            font-size: 14px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .game-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            width: 260px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .game-card:hover {
            border-color: #0070d1;
        }
        .game-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #2a2a2a;
        }
        .game-info {
            padding: 15px;
        }
        .game-info h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #0070d1;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
        }
        .btn-download:hover {
            background-color: #005fb8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Kauan PJL - Catálogo PS3</h1>
        <p>Baixe seus jogos em formato PKG diretamente no console</p>
    </header>

    <div class="container">
        <!-- Cartão do Jogo: Uncharted 1 -->
        <div class="game-card">
            <!-- Substitua o link da imagem abaixo se preferir -->
            <img src="https://upload.wikimedia.org/wikipedia/en/2/29/Uncharted_Drakes_Fortune_Box_Art.jpg" alt="Uncharted: Drake's Fortune">
            <div class="game-info">
                <h3>Uncharted: Drake's Fortune</h3>
                <!-- Cole o link direto do arquivo PKG no href abaixo -->
                <a href="URL_DO_SEU_JOGO.pkg" class="btn-download">Baixar PKG</a>
            </div>
        </div>

        <!-- Podes duplicar o bloco ".game-card" acima para adicionar mais jogos -->
    </div>

</body>
</html>
