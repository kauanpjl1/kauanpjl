<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAUAN PJL - Início</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { 
            background-color: #0b0b0e; 
            color: #ffffff; 
            text-align: center; 
            background-image: radial-gradient(#1a1a2e 15%, transparent 16%), radial-gradient(#151522 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            padding-bottom: 30px;
        }
        
        /* Banner Topo Estilo Michael17 */
        .banner-topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, #120024, #2b0054, #120024);
            border-bottom: 3px solid #00ff75;
            padding: 10px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            margin-bottom: 25px;
        }

        .banner-side-img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ff75;
            box-shadow: 0 0 10px #00ff75;
        }

        .banner-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px #00ff75, 0 0 20px #005fb8;
            letter-spacing: 2px;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }

        /* Cartões de Categoria com Título Embutido */
        .category-card {
            display: block;
            position: relative;
            width: 100%;
            height: 130px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.7);
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
        }

        .category-card:hover {
            transform: scale(1.02);
            border-color: #00ff75;
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.5); /* Escurece um pouco a imagem para o texto destacar */
        }

        .card-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #00ff75;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), 0 0 10px #00ff75;
            letter-spacing: 1px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Banner Superior com Link e Zelda -->
    <div class="banner-topo">
        <!-- Foto do Link -->
        <img src="https://assets.nintendo.com/image/upload/f_auto/q_auto/dpr_2.0/c_scale,w_500/ncom/en_US/games/switch/t/the-legend-of-zelda-tears-of-the-kingdom-switch/hero" alt="Link" class="banner-side-img">
        
        <div class="banner-title">KAUAN PJL</div>
        
        <!-- Foto da Zelda -->
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6S8v-6Z3g_hV6V0vJ1xS2u8vX5S0Z4v3Q3A&s" alt="Zelda" class="banner-side-img" onerror="this.src='https://assets.nintendo.com/image/upload/f_auto/q_auto/dpr_2.0/c_scale,w_500/ncom/en_US/characters/zelda/character_zelda_totk.png'">
    </div>

    <div class="container">

        <!-- JOGOS PS3 -->
        <a href="jogos-ps3.html" class="category-card">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600" alt="Jogos PS3">
            <div class="card-text">JOGOS PS3</div>
        </a>

        <!-- LOJAS -->
        <a href="#" class="category-card">
            <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600" alt="Lojas">
            <div class="card-text">LOJAS</div>
        </a>

        <!-- HOMEBREWS -->
        <a href="#" class="category-card">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600" alt="Homebrews">
            <div class="card-text">HOMEBREWS</div>
        </a>

        <!-- TEMAS -->
        <a href="#" class="category-card">
            <img src="https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?w=600" alt="Temas">
            <div class="card-text">TEMAS</div>
        </a>

    </div>

</body>
</html>
