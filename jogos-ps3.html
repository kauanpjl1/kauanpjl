<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos PS3 - Kauan PJL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0b0b0e; color: #ffffff; text-align: center; padding: 15px; }
        
        .btn-top {
            display: inline-block;
            background-color: #1f292e;
            color: #00ff75;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #2a383f;
        }

        .title {
            color: #00ff75;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .grid-jogos {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        .game-card-link {
            text-decoration: none;
            background: #151515;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            padding: 10px;
            gap: 15px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .game-card-link:hover {
            transform: scale(1.02);
            border-color: #00ff75;
        }

        .game-cover {
            width: 90px;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .game-name {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-align: left;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-top">⬅ Voltar ao Início</a>

    <div class="title">🎮 ESCOLHA O JOGO PS3</div>

    <div class="grid-jogos">
        <!-- Clica aqui para abrir as partes do Uncharted 1 -->
        <a href="uncharted1.html" class="game-card-link">
            <img src="https://m.media-amazon.com/images/M/MV5BZWU2M2E0YzEtYmYxZi00MTY2LWI4MDQtMWExM2I1NWQ2ZmI4XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Uncharted 1" class="game-cover">
            <div class="game-name">Uncharted 1: Drake's Fortune</div>
        </a>

        <!-- Futuros jogos entram aqui em baixo no mesmo formato -->
    </div>

</body>
</html>
